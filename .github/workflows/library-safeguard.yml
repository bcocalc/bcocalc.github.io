name: Library safeguard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-safeguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/release-check.mjs --unit-only

  mobile-library:
    needs: contract-and-sync
    runs-on: ubuntu-24.04
    # The apt mirror exhausted 35 minutes before WebKit tests could start.
    # Official image includes browsers/OS dependencies; match the npm version below.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    timeout-minutes: ${{ matrix.browser == 'webkit' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test-only dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - name: Verify pinned preinstalled browser
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {accessSync} = require('node:fs');
          const pw = require('playwright');
          assert.equal(require('playwright/package.json').version, '1.64.0');
          const browser = process.env.TAPCALC_BROWSER;
          const executable = pw[browser].executablePath();
          accessSync(executable);
          console.log('PREINSTALLED_BROWSER', JSON.stringify({browser, executable, node: process.version}));
          NODE
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check local-job opening and syncing by touch
        run: node tests/library-touch.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check pending dev workflow and Reference on phone and desktop
        run: node tests/dev-features.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check dev Tools reload and independent mode ownership
        run: node tests/tools-mode-reload-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check actual POP preview, apply, undo and saved state
        run: node tests/hot-tap-field-reading-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check added steel pipe sizes on live and dev
        run: node tests/pipe-sizes-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check coupon-free cutout calculator
        run: node tests/coupon-free-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check isolated Pre-Alpha job loading and operation switching
        run: node tests/pre-alpha-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check Pre-Alpha concurrent saves and conflict recovery
        run: node tests/pre-alpha-workspace-store-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check Pre-Alpha presentation, accessible details and save preservation
        run: node tests/pre-alpha-presentation-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check blank Hot Tap LD, saved-job hydration and calculated results
        run: node tests/pre-alpha-hot-tap-ld-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Fetch immutable published 10 and 11 baselines for installed-worker tests
        run: |
          git fetch --no-tags --depth=1 origin 21bf9b289196c25912f38424573b295209e49e03
          git fetch --no-tags --depth=1 origin 54aec7b984cec1c37ddeea4c5e17c46376473a24
      - name: Verify independent offline and persistent-cache controls
        run: |
          node tests/pre-alpha-offline-control.mjs
          node tests/pre-alpha-cache-context-control.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Check Pre-Alpha installed-worker upgrade, offline and rollback
        run: node tests/pre-alpha-worker-upgrade-ui.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Diagnose minimal offline runner after a failure
        if: failure()
        run: node tests/pre-alpha-offline-control.mjs
        env:
          TAPCALC_BROWSER: ${{ matrix.browser }}
      - name: Retain synthetic browser screenshots after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pre-alpha-diagnostics-${{ matrix.browser }}
          path: /tmp/pre-alpha-*.png
          if-no-files-found: ignore
          retention-days: 7

  full-release:
    needs: mobile-library
    runs-on: ubuntu-24.04
    # Same pinned environment as the component checks; no slow apt mirror setup.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test-only dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - name: Verify both pinned preinstalled browser engines
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {accessSync} = require('node:fs');
          const pw = require('playwright');
          assert.equal(require('playwright/package.json').version, '1.64.0');
          for (const browser of ['chromium', 'webkit']) {
            const executable = pw[browser].executablePath();
            accessSync(executable);
            console.log('PREINSTALLED_BROWSER', JSON.stringify({browser, executable, node: process.version}));
          }
          NODE
      - name: Fetch immutable published 10 and 11 baselines for installed-worker tests
        run: |
          git fetch --no-tags --depth=1 origin 21bf9b289196c25912f38424573b295209e49e03
          git fetch --no-tags --depth=1 origin 54aec7b984cec1c37ddeea4c5e17c46376473a24
      - name: Run the complete release command without retries
        run: node tests/release-check.mjs
      - name: Retain synthetic screenshots after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-diagnostics
          path: /tmp/pre-alpha-*.png
          if-no-files-found: ignore
          retention-days: 7
